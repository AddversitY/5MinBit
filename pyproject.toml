[project]
name = "btc5m"
version = "0.1.0"
description = "Research + paper-testing prediction engine for Polymarket BTC 5-minute Up/Down markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "hmmlearn>=0.3",
  "statsmodels>=0.14",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
btc5m = "btc5m.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
