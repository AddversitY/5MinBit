name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -W ignore::DeprecationWarning
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  windows:
    # Exercises the Windows paper-test runner exactly as a user would, then the test suite and a
    # short server start-up on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner setup (uv, Python env, dashboard build)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -NoProfile -File scripts\windows\run-paper-test.ps1 -SetupOnly
      - name: Tests on Windows
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv pip install --quiet --python .venv\Scripts\python.exe -e ".[dev]"
          .venv\Scripts\python.exe -m pytest -q -W ignore::DeprecationWarning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Server starts, answers, and refuses a second writer
        shell: powershell
        run: |
          $p = Start-Process .venv\Scripts\btc5m.exe -ArgumentList "serve","--host","127.0.0.1","--port","8000" -PassThru -RedirectStandardError serve.err -RedirectStandardOutput serve.out
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest http://127.0.0.1:8000/api/health -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          $second = Start-Process .venv\Scripts\btc5m.exe -ArgumentList "serve","--port","8001" -PassThru -Wait -NoNewWindow
          Stop-Process -Id $p.Id -Force
          Get-Content serve.err -Tail 20
          if (-not $ok) { throw "server did not answer /api/health" }
          if ($second.ExitCode -ne 3) { throw "second server was not refused (exit $($second.ExitCode))" }
